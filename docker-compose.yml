version: '3.9'

services:

# ---------------- API GATEWAY ----------------

api-gateway:
build:
context: .
dockerfile: api-gateway/Dockerfile
container_name: api-gateway
restart: always
environment:
ASPNETCORE_ENVIRONMENT: Development
Jwt__Key: ${JWT_KEY}
Jwt__Issuer: ${JWT_ISSUER}
Jwt__Audience: ${JWT_AUDIENCE}
ports:
- "5000:8080"
depends_on:
auth-service:
condition: service_healthy
product-service:
condition: service_healthy
cart-service:
condition: service_healthy
networks:
- ecommerce-network

# ---------------- PRODUCT DATABASE ----------------

product-sql:
image: mcr.microsoft.com/mssql/server:2022-latest
container_name: product-sql
restart: always
environment:
ACCEPT_EULA: "Y"
SA_PASSWORD: ${SA_PASSWORD}
ports:
- "1434:1433"
volumes:
- product-sql-data:/var/opt/mssql
healthcheck:
test: ["CMD-SHELL", "echo 'SELECT 1' | /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} || exit 1"]
interval: 10s
timeout: 5s
retries: 10
start_period: 30s
networks:
- ecommerce-network

# ---------------- PRODUCT SERVICE ----------------

product-service:
build:
context: .
dockerfile: services/product/ProductService.API/Dockerfile
container_name: productservice-api
restart: on-failure
environment:
ASPNETCORE_ENVIRONMENT: Development
ConnectionStrings__DefaultConnection: "Server=product-sql,1433;Database=ProductDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
Jwt__Key: ${JWT_KEY}
Jwt__Issuer: ${JWT_ISSUER}
Jwt__Audience: ${JWT_AUDIENCE}
ports:
- "5002:8080"
depends_on:
product-sql:
condition: service_healthy
healthcheck:
test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
interval: 20s
timeout: 5s
retries: 5
networks:
- ecommerce-network

# ---------------- CART DATABASE ----------------

cart-sql:
image: mcr.microsoft.com/mssql/server:2022-latest
container_name: cart-sql
restart: always
environment:
ACCEPT_EULA: "Y"
SA_PASSWORD: ${SA_PASSWORD}
ports:
- "1432:1433"
volumes:
- cart-sql-data:/var/opt/mssql
healthcheck:
test: ["CMD-SHELL", "echo 'SELECT 1' | /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} || exit 1"]
interval: 10s
timeout: 5s
retries: 10
start_period: 30s
networks:
- ecommerce-network

# ---------------- CART SERVICE ----------------

cart-service:
build:
context: .
dockerfile: services/cart/CartService.API/Dockerfile
container_name: cartservice-api
restart: on-failure
environment:
ASPNETCORE_ENVIRONMENT: Development
ConnectionStrings__DefaultConnection: "Server=cart-sql,1433;Database=CartDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
Jwt__Key: ${JWT_KEY}
Jwt__Issuer: ${JWT_ISSUER}
Jwt__Audience: ${JWT_AUDIENCE}
ports:
- "5003:8080"
depends_on:
cart-sql:
condition: service_healthy
healthcheck:
test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
interval: 20s
timeout: 5s
retries: 5
networks:
- ecommerce-network

# ---------------- AUTH DATABASE ----------------

auth-sql:
image: mcr.microsoft.com/mssql/server:2022-latest
container_name: auth-sql
restart: always
environment:
ACCEPT_EULA: "Y"
SA_PASSWORD: ${SA_PASSWORD}
ports:
- "1433:1433"
volumes:
- auth-sql-data:/var/opt/mssql
healthcheck:
test: ["CMD-SHELL", "echo 'SELECT 1' | /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} || exit 1"]
interval: 10s
timeout: 5s
retries: 10
start_period: 30s
networks:
- ecommerce-network

# ---------------- AUTH SERVICE ----------------

auth-service:
build:
context: .
dockerfile: services/auth/AuthService.API/Dockerfile
container_name: authservice-api
restart: on-failure
environment:
ASPNETCORE_ENVIRONMENT: Development
ConnectionStrings__DefaultConnection: "Server=auth-sql,1433;Database=AuthDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
Jwt__Key: ${JWT_KEY}
Jwt__Issuer: ${JWT_ISSUER}
Jwt__Audience: ${JWT_AUDIENCE}
ports:
- "5001:8080"
depends_on:
auth-sql:
condition: service_healthy
healthcheck:
test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
interval: 20s
timeout: 5s
retries: 5
networks:
- ecommerce-network

networks:
ecommerce-network:
driver: bridge

volumes:
auth-sql-data:
product-sql-data:
cart-sql-data:
