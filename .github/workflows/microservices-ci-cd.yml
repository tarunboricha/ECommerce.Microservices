name: ECommerce Microservices CI/CD (Docker Local Deployment)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
    - name: 1️⃣ Checkout Repository
      uses: actions/checkout@v3

    - name: 2️⃣ Restore All Dependencies
      shell: powershell
      run: dotnet restore

    - name: 3️⃣ Build Entire Solution (All Microservices)
      shell: powershell
      run: dotnet build --configuration Release --no-restore

    - name: 4️⃣ Run Unit Tests (Skip if not exist)
      shell: powershell
      run: |
        $slnList = dotnet sln list 2>$null
        if ($slnList -match "test") {
          Write-Host "Test projects found. Running tests..."
          dotnet test --no-build --verbosity normal
        } else {
          Write-Host "No test projects found. Skipping test cases."
        }

    - name: Create .env File (UTF-8 for Docker)
      shell: powershell
      run: |
        $envContent = @"
                        SA_PASSWORD=${{ secrets.SA_PASSWORD }}
                        JWT_KEY=${{ secrets.JWT_KEY }}
                        JWT_ISSUER=${{ secrets.JWT_ISSUER }}
                        JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
                        "@
                            [System.IO.File]::WriteAllText(".env", $envContent, [System.Text.Encoding]::UTF8)

    - name: 6️⃣ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 7️⃣ Build All Microservices Containers
      shell: powershell
      run: docker compose build

    - name: 8️⃣ Start Full Microservices Stack (Local Deployment Simulation)
      shell: powershell
      run: docker compose up -d

    - name: 9️⃣ Verify Running Containers
      shell: powershell
      run: docker ps